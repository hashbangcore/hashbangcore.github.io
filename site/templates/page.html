{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
  <article>
    <header>
      <h2>{{ page.title }}</h2>
      {% if page.date %}
        <p>{{ page.date | date(format="%Y-%m-%d") }}</p>
      {% endif %}
    </header>
    {{ page.content | safe }}
  </article>
{% endblock content %}
